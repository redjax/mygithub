  redis_data:
  rabbitmq_data:

networks:
  mygithub_devnet:

services:
  alembic_migrate:
    container_name: ${CELERY_BEAT_CONTAINER_NAME:-mygithub_alembic_migrate}-dev
    restart: no
    build:
      context: ..
      dockerfile: ./containers/dockerfiles/dev.Dockerfile
      target: alembic_migrate
    working_dir: /project
    env_file:
      - ./envs/dev.app.env
    # ## Uncomment for debugging
    # # command: ["/bin/bash"]
    volumes:
      - ../applications:/project/applications
      - ../packages:/project/packages
      - ../scripts:/project/scripts
      - ../src:/project/src
      - ./container_data/mygithub/db:/mygithub/db
      - ../migrations:/project/migrations
      - ../alembic.ini:/project/alembic.ini
    networks:
      - mygithub_devnet

