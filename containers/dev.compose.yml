  mygithub:
    container_name: mygithub_scheduler-dev
    restart: unless-stopped
    build:
      context: ..
      dockerfile: ./containers/dockerfiles/dev.Dockerfile
      target: scheduler
    working_dir: /project
    env_file:
      - ./envs/dev.app.env
    command: ["uv", "run", "scripts/schedules/every_15th_minute_get_stars.py", "-m", "beat"]
    # command: ["uv", "run", "scripts/debug/debug_settings.py"]
    volumes:
      - ../alembic:/project/alembic
      - ../applications:/project/applications
      - ../packages:/project/packages
      - ../scripts:/project/scripts
      - ../src:/project/src
      - ./container_data/mygithub/scheduler/logs:/project/logs
    networks:
      - mygithub_devnet